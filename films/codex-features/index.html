<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Codex, Fully Loaded</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Unbounded:wght@500;600;700&family=Be+Vietnam+Pro:wght@500;600;700&display=swap">
<style>
/* Explainer-film engine. Layout: full-bleed WebGL diorama; a "board" panel docked right like a second camera
   (lesson notes, code, a terminal, quizzes); narration runs as film subtitles lower-left; HUD and transport
   are thin chrome that never compete with the stage. The film is dark by design (it is a screening room),
   so there is a single palette; colors are tokens so a story can re-tint the hero and accents. */
:root{
  --ink-0:#050913; --ink-1:#0a1020; --ink-2:#111a30; --ink-3:#1b2645;
  --line:rgba(150,170,230,.15); --line-strong:rgba(150,170,230,.30);
  --hero:#d97757; --hero-hi:#f2a383; --hero-ink:#1b0f0a;
  --cream:#f3ede3; --mist:#a7b0ca; --dim:#6d7695;
  --signal:#6fe3d0; --gold:#f2c46d; --violet:#ab9cff; --ok:#7dd88f; --bad:#ff7a85;
  --b-bg:rgba(8,11,21,.95); --b-fg:#ebe7e0; --b-dim:#8d93a9; --b-faint:#5a617a;
  --c-g:#62d48d; --c-r:#ff6f7d; --c-b:#93b5ff; --c-v:#bba8ff; --c-t:#5fcab9; --c-y:#f0c86a;
  --f-display:"Unbounded","Be Vietnam Pro","Arial Black",system-ui,sans-serif;
  --f-narr:"Newsreader","Be Vietnam Pro",Georgia,serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-ui:"Be Vietnam Pro",system-ui,sans-serif;
  --gutter:clamp(16px,2.2vw,40px);
  --dock-w:min(40vw,760px);
  --b-size:clamp(12px,.9vw,16px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink-1);color:var(--cream);font:14px/1.45 var(--f-mono);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
kbd{font:600 .86em/1 var(--f-mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:2px 6px 1px;background:rgba(255,255,255,.04);color:var(--cream)}
#app{position:fixed;inset:0;overflow:hidden}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 30% 35%,#13203f 0%,var(--ink-1) 55%,var(--ink-0) 100%)}
#gl{display:block;width:100%;height:100%;outline:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 110% at 30% 42%,transparent 52%,rgba(3,6,14,.62) 100%),linear-gradient(to top,rgba(4,7,16,.8) 0,rgba(4,7,16,0) 36%)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fallback-note{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:var(--mist);font:500 13px/1.5 var(--f-mono);text-align:center;max-width:80%}

/* ---------- 3D-anchored labels ---------- */
.lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap;transition:opacity .35s ease;pointer-events:none}
.lbl.hide{opacity:0}
.lbl>.in{transform-origin:50% 100%;animation:lblIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes lblIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.tag{font:500 12px/1 var(--f-mono);letter-spacing:.03em;color:var(--cream);background:rgba(9,14,28,.78);border:1px solid var(--line-strong);padding:6px 9px;border-radius:7px;backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:7px}
.tag .dot{width:7px;height:7px;border-radius:2px;background:currentColor;flex:none}
.tag .sm{color:var(--mist);font-weight:400}
.tag.big{font-size:14px;padding:8px 11px}
.tag.warn{border-color:rgba(255,122,133,.6);color:#ffd5d9}
.tag.ok{border-color:rgba(125,216,143,.55)}
.tag.hero{border-color:var(--hero);color:var(--hero-hi)}
.bubble{position:relative;font:600 13px/1.25 var(--f-display);letter-spacing:.01em;color:#141826;background:var(--cream);padding:8px 12px 9px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.4);margin-bottom:10px;white-space:normal;max-width:260px;width:max-content}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:11px;height:11px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bubble.think{background:#dfe7ff}.bubble.alert{background:#ffd9d2}.bubble.good{background:#d9f5df}
.meter{font:600 12px/1 var(--f-mono);color:var(--cream);background:rgba(9,14,28,.82);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;min-width:132px}
.meter .mt{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-weight:500;color:var(--mist);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.meter .mt b{color:var(--cream);font-weight:700;letter-spacing:0}
.meter .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--ok);transition:width .25s linear,background .4s}
.card3d{font:500 12.5px/1.35 var(--f-mono);color:var(--cream);background:rgba(12,18,36,.9);border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;white-space:normal;width:max-content;max-width:240px}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gutter) 0;z-index:20;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font:600 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--cream);white-space:nowrap}
.brand .mark{width:14px;height:14px;border-radius:4px;background:var(--hero);box-shadow:0 0 12px var(--hero)}
.hud-scene{display:flex;align-items:baseline;gap:10px;font:500 12px/1 var(--f-mono);color:var(--mist);padding-left:18px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud-scene b{color:var(--hero-hi);font-weight:700}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.chipd{display:flex;align-items:center;gap:8px;font:700 12px/1 var(--f-mono);letter-spacing:.08em;color:var(--cream);background:rgba(9,14,28,.7);border:1px solid var(--line);border-radius:999px;padding:6px 11px 6px 9px}
.chipd .sun{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.chipd .t{color:var(--mist);font-weight:500}
.chipd[hidden]{display:none}
.concepts{display:flex;gap:4px}
.cp{font:700 9.5px/1 var(--f-mono);letter-spacing:.04em;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:5px 0;min-width:34px;padding-inline:4px;text-align:center;background:rgba(9,14,28,.55);transition:all .4s}
.cp.on{color:var(--hero-ink);background:var(--hero);border-color:var(--hero);box-shadow:0 0 14px color-mix(in srgb,var(--hero) 45%,transparent)}
.cp.pop{animation:cpPop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes cpPop{0%{transform:scale(1)}35%{transform:scale(1.55)}100%{transform:scale(1)}}

/* ---------- title card ---------- */
#titlecard{position:absolute;left:var(--gutter);top:46%;transform:translateY(-50%);width:min(calc(100vw - var(--dock-w) - var(--gutter)*3),980px);pointer-events:none;z-index:15}
#titlecard>*{opacity:0}
.tc-eyebrow{font:500 12px/1.3 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--hero-hi)}
.tc-title{font:700 clamp(36px,5.2vw,98px)/1.02 var(--f-display);letter-spacing:-.025em;margin:.28em 0 .22em;text-wrap:balance;color:var(--cream);text-shadow:0 10px 50px rgba(0,0,0,.55)}
.tc-sub{font:italic 400 clamp(18px,1.6vw,30px)/1.3 var(--f-narr);color:var(--mist);margin:0;max-width:34ch;text-shadow:0 2px 16px rgba(0,0,0,.6)}
#titlecard.show>*{animation:tcIn .8s cubic-bezier(.2,.9,.25,1) both}
#titlecard.show .tc-title{animation-delay:.08s}
#titlecard.show .tc-sub{animation-delay:.2s}
#titlecard.show .tc-cta{animation-delay:.3s}
#titlecard.hide>*{animation:tcOut .55s cubic-bezier(.5,0,.75,0) both}
@keyframes tcIn{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes tcOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-14px);filter:blur(4px)}}
#titlecard.hero .tc-title{font-size:clamp(42px,6.2vw,120px)}
.tc-cta{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font:500 12.5px/1 var(--f-mono);color:var(--mist);pointer-events:auto}
.tc-cta[hidden]{display:none}
.btn,.tc-cta button{pointer-events:auto;cursor:pointer;border:1px solid var(--hero);background:var(--hero);color:var(--hero-ink);font:700 13px/1 var(--f-mono);padding:12px 16px;border-radius:10px;letter-spacing:.02em}
.btn.ghost,.tc-cta button.ghost{background:transparent;color:var(--cream);border-color:var(--line-strong)}
.btn:hover,.tc-cta button:hover{filter:brightness(1.08)}
.btn:focus-visible,.tc-cta button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.tc-sound{flex-basis:100%;display:flex;align-items:flex-start;gap:9px;margin-top:8px;font:500 12px/1.4 var(--f-mono);color:var(--mist);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.tc-sound svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--hero-hi)}

/* ---------- narration ---------- */
#narration{position:absolute;left:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(calc(100vw - var(--dock-w) - var(--gutter)*3),860px);z-index:12;pointer-events:none;display:grid;align-items:end}
.nl{grid-area:1/1;margin:0;font:400 clamp(19px,1.55vw,31px)/1.34 var(--f-narr);color:var(--cream);text-wrap:pretty;text-shadow:0 2px 18px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.6);opacity:0;transform:translateY(10px);filter:blur(4px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.9,.25,1),filter .55s ease}
.nl.in{opacity:1;transform:none;filter:none}
.nl.out{opacity:0;transform:translateY(-10px);filter:blur(3px);transition-duration:.4s}
.nl em{font-style:italic;color:var(--hero-hi)}
.nl b{font-weight:500;color:var(--gold)}
.nl code{font:500 .74em/1 var(--f-mono);background:rgba(10,16,32,.7);border:1px solid var(--line);padding:.18em .42em;border-radius:6px;color:var(--cream);white-space:nowrap}

/* ---------- dock: board + field note ---------- */
#dock{position:absolute;right:var(--gutter);top:calc(env(safe-area-inset-top,0px) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);width:var(--dock-w);display:flex;flex-direction:column;gap:12px;z-index:10;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.25,1)}
.nodock #dock{opacity:0;transform:translateX(60px);pointer-events:none}
.nodock #titlecard,.nodock #narration{width:min(56vw,1040px)}
.board{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--b-bg);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);overflow:hidden}
.bd-bar{flex:none;display:flex;align-items:center;gap:12px;height:34px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025);font:500 11.5px/1 var(--f-mono);color:var(--b-dim)}
.dots{display:flex;gap:7px;flex:none}.dots i{width:11px;height:11px;border-radius:50%}
.dots i:nth-child(1){background:#e2665c}.dots i:nth-child(2){background:#dfb04a}.dots i:nth-child(3){background:#5cb85c}
.bd-title{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:46px}
.bd-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 20px 12px;color:var(--b-fg)}
.bd-scroll{flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.bd-scroll.over{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34px);mask-image:linear-gradient(to bottom,transparent 0,#000 34px)}
.bd-scroll::-webkit-scrollbar{display:none}
.bd-log{display:flex;flex-direction:column;gap:.5em;padding-top:2px}
.bd-input{flex:none;padding-top:6px;font:400 var(--b-size)/1.5 var(--f-mono)}
.bd-input[hidden]{display:none!important}
.bi-rule{height:1px;background:var(--b-faint);opacity:.7}
.bi-line{display:flex;align-items:flex-start;gap:1ch;padding:.42em 0;min-height:2.4em}
.bi-caret{color:var(--b-dim);flex:none}
.bi-text{white-space:pre-wrap;word-break:break-word}
.bi-text.ph{color:var(--b-faint)}
.bd-foot{font-size:.9em;color:var(--b-dim);padding:.3em 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-foot:empty{display:none}
.bi-cursor{display:inline-block;width:.62em;height:1.2em;background:var(--b-fg);vertical-align:-.2em;animation:cur 1.05s steps(2,start) infinite;margin-left:-1ch;flex:none}
@keyframes cur{to{visibility:hidden}}
/* entries */
.ln{animation:lnIn .35s cubic-bezier(.2,.9,.25,1) both;min-width:0}
@keyframes lnIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ln b{color:var(--cream);font-weight:700}
.ln code{font:500 .92em/1 var(--f-mono);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:5px;padding:.12em .38em}
.ln em{color:var(--hero-hi);font-style:italic}
.c-g{color:var(--c-g)}.c-r{color:var(--c-r)}.c-b{color:var(--c-b)}.c-v{color:var(--c-v)}.c-t{color:var(--c-t)}.c-y{color:var(--c-y)}.c-o{color:var(--hero-hi)}.c-d{color:var(--b-dim)}.c-w{color:var(--cream)}
/* notes mode */
.m-notes .bd-log{font:400 calc(var(--b-size)*1.12)/1.5 var(--f-narr)}
.m-notes .ln.h{font:700 calc(var(--b-size)*1.25)/1.2 var(--f-display);letter-spacing:-.01em;color:var(--cream);margin-top:.5em}
.m-notes .ln.h:first-child{margin-top:0}
.m-notes .ln.k{font:700 10.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--hero-hi);margin-top:.6em}
.ln.li{display:flex;gap:.7em}.ln.li::before{content:"";flex:none;width:.42em;height:.42em;margin-top:.55em;border-radius:2px;background:var(--hero)}
.ln.li.ok::before{background:var(--ok)}.ln.li.bad::before{background:var(--bad)}.ln.li.dim{color:var(--b-dim)}.ln.li.dim::before{background:var(--b-faint)}
.ln.step{display:flex;gap:.8em;align-items:baseline}.ln.step .n{flex:none;font:700 11px/1 var(--f-mono);color:var(--hero-ink);background:var(--hero);border-radius:6px;padding:5px 7px}
.ln.def{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:.2em 1em;border-left:3px solid var(--signal);padding:.35em 0 .35em .9em;background:rgba(111,227,208,.05);border-radius:0 8px 8px 0}
.ln.def .t{font:600 .86em/1.5 var(--f-mono);color:var(--signal)}
.ln.math{font:500 calc(var(--b-size)*1.45)/1.35 var(--f-narr);text-align:center;padding:.5em .6em;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);color:var(--cream)}
.ln.math sub,.ln.math sup{font-size:.62em}
.ln.quote{font-style:italic;color:var(--mist);border-left:3px solid var(--gold);padding-left:.9em}
.ln.kv{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:.25em 1.2em;font-size:.95em}
.ln.kv .k{color:var(--b-dim);font:500 .85em/1.6 var(--f-mono)}
.ln.hr{height:1px;background:var(--line);margin:.4em 0}
.ln.media{display:flex;justify-content:center}
.ln.media svg{max-width:100%;height:auto}
.ln.hl{animation:lnIn .35s both,hl 1.6s ease-out}
@keyframes hl{0%{background:color-mix(in srgb,var(--gold) 28%,transparent)}100%{background:transparent}}
/* terminal mode */
.m-term .bd-log{font:400 var(--b-size)/1.52 var(--f-mono);gap:.15em}
.m-term .ln.h{font-weight:700;color:var(--cream)}
.ln.user{color:var(--b-fg);background:rgba(255,255,255,.05);border-radius:6px;padding:.25em .6em;margin:.3em 0}
.ln.user .gt{color:var(--b-dim);margin-right:.6ch}
.ln.say{display:flex;gap:1ch}.ln.say .b{color:var(--b-fg);flex:none}
.ln.tool .hd{display:flex;gap:1ch}.ln.tool .b{flex:none;color:var(--c-g)}
.ln.tool.run .b{color:var(--b-dim);animation:blink 1s steps(2,start) infinite}
.ln.tool.err .b{color:var(--c-r)}
@keyframes blink{to{opacity:.2}}
.ln.tool .tn{font-weight:700;color:var(--cream)}
.sub{display:flex;gap:1ch;color:var(--b-dim);padding-left:2ch}.sub .el{flex:none;width:1.5ch}
.ln.spin{color:var(--hero-hi)}.ln.spin .m{color:var(--b-dim)}
.ln.shell .ps{color:var(--c-b)}
/* code block (both modes) */
.ln.code{font:400 calc(var(--b-size)*.95)/1.55 var(--f-mono);background:#0d1222;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ln.code .ct{font-size:.85em;color:var(--b-dim);padding:.45em .9em;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
.ln.code pre{margin:0;padding:.6em .9em;white-space:pre-wrap;word-break:break-word}
.ln.code .row{display:block}.ln.code .row.add{background:rgba(98,212,141,.14)}.ln.code .row.del{background:rgba(255,111,125,.14)}.ln.code .row.mark{background:rgba(242,196,109,.14)}
/* quiz */
.ln.quiz{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:rgba(242,196,109,.05);border-radius:12px;padding:.8em .9em;display:flex;flex-direction:column;gap:.6em}
.quiz .qk{font:700 10.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.quiz .qq{font:600 calc(var(--b-size)*1.12)/1.35 var(--f-display);color:var(--cream)}
.quiz .qc{display:grid;gap:.4em}
.quiz button{text-align:left;cursor:pointer;font:500 calc(var(--b-size)*1.02)/1.35 var(--f-narr);color:var(--cream);background:rgba(255,255,255,.04);border:1px solid var(--line-strong);border-radius:9px;padding:.55em .8em;display:flex;gap:.7em;align-items:baseline}
.quiz button .l{font:700 .78em/1 var(--f-mono);color:var(--gold);flex:none}
.quiz button:hover:not([disabled]){border-color:var(--gold);background:rgba(242,196,109,.08)}
.quiz button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.quiz button[disabled]{cursor:default}
.quiz button.right{border-color:var(--ok);background:rgba(125,216,143,.14)}
.quiz button.wrong{border-color:var(--bad);background:rgba(255,122,133,.12)}
.quiz .qx{font:400 calc(var(--b-size)*1.02)/1.45 var(--f-narr);color:var(--mist)}
.quiz .qx[hidden]{display:none}
.quiz .qt{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}.quiz .qt i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left}
/* field note */
.takeaway{flex:none;background:rgba(14,21,40,.92);border:1px solid color-mix(in srgb,var(--hero) 45%,transparent);border-radius:14px;padding:14px 16px;box-shadow:0 20px 60px rgba(0,0,0,.45);opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.25,1)}
.takeaway.show{opacity:1;transform:none}
.takeaway[hidden]{display:none}
.tk-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.tk-k{font:700 10px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--hero-hi)}
.tk-t{font:600 15px/1.2 var(--f-display);color:var(--cream)}
.tk-when{margin:0 0 8px;font:400 15px/1.4 var(--f-narr);color:var(--mist)}
.tk-rows{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:5px 14px;font:500 12px/1.4 var(--f-mono);color:var(--b-dim)}
.tk-rows .c{color:var(--cream)}
.kb{font:500 .95em/1 var(--f-mono);border:1px solid var(--line-strong);border-radius:6px;padding:3px 7px;color:var(--cream);background:rgba(255,255,255,.04);white-space:nowrap}

/* ---------- recap (finale) ---------- */
#recap{position:absolute;right:var(--gutter);top:calc(env(safe-area-inset-top,0px) + 60px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:min(61vw,940px);z-index:14;display:flex;flex-direction:column;gap:clamp(12px,1.6vh,18px);padding:clamp(16px,2.4vh,24px) clamp(18px,1.8vw,28px);background:rgba(9,14,28,.9);border:1px solid var(--line-strong);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:auto;scrollbar-width:thin;opacity:0;transform:translateX(40px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.25,1)}
#recap.show{opacity:1;transform:none}
#recap[hidden]{display:none!important}
.rc-k{font:700 10.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.rc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.rc-head h2{font:700 clamp(24px,2.4vw,42px)/1.05 var(--f-display);letter-spacing:-.02em;margin:.32em 0 0;color:var(--cream)}
.rc-lede{margin:-2px 0 0;font:italic 400 clamp(15px,1.05vw,19px)/1.4 var(--f-narr);color:var(--mist);text-wrap:pretty}
.rc-lede b{font-weight:500;font-style:normal;color:var(--gold)}
.rc-grid{display:grid;grid-template-columns:auto minmax(0,max-content) minmax(0,1fr) auto;column-gap:clamp(10px,1.1vw,18px);border-top:1px solid var(--line)}
.rc-row{display:contents}
.rc-row>span{display:flex;align-items:center;min-width:0;padding:clamp(4px,.6vh,8px) 0;border-bottom:1px solid var(--line);animation:rcIn .5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(.25s + var(--i) * 45ms)}
@keyframes rcIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rc-chip{font:700 9.5px/1 var(--f-mono);letter-spacing:.04em;color:var(--hero-ink);background:var(--hero);border-radius:5px;padding:5px 4px;min-width:36px;text-align:center}
.rc-row.z .rc-chip{background:var(--gold)}
.rc-n{font:600 clamp(12px,.86vw,14px)/1.2 var(--f-display);color:var(--cream);white-space:nowrap}
.rc-w{font:400 clamp(14px,1vw,17px)/1.3 var(--f-narr);color:var(--mist);text-wrap:pretty}
.rc-ch{border:1px solid rgba(242,196,109,.32);background:rgba(242,196,109,.05);border-radius:12px;padding:12px 16px}
.rc-ch ol{margin:9px 0 0;padding-left:1.5em;font:400 clamp(14px,1.02vw,17.5px)/1.42 var(--f-narr);color:var(--cream)}
.rc-ch li::marker{font:700 12px var(--f-mono);color:var(--gold)}
.rc-cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- transport ---------- */
#transport{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:10px var(--gutter) calc(14px + env(safe-area-inset-bottom,0px));z-index:30;transition:opacity .5s ease}
.idle #transport{opacity:0}
.idle{cursor:none}
.tbtn{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:rgba(13,20,38,.72);color:var(--cream);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:600 11.5px/1 var(--f-mono);letter-spacing:.03em;flex:none;backdrop-filter:blur(8px)}
.tbtn:hover{border-color:var(--line-strong);background:rgba(27,38,69,.85)}
.tbtn:focus-visible{outline:2px solid var(--hero);outline-offset:2px}
.tbtn svg{width:15px;height:15px;display:block}
.tbtn.on{color:var(--hero-hi);border-color:color-mix(in srgb,var(--hero) 50%,transparent)}
#b-play{width:44px;background:var(--hero);border-color:var(--hero);color:var(--hero-ink);backdrop-filter:none}
#b-play:hover{background:var(--hero-hi)}
.timeline{flex:1;display:flex;gap:10px;align-items:flex-end;min-width:0;height:36px;padding:0 6px}
.act{display:flex;flex-direction:column;gap:6px;min-width:0}
.act-l{font:700 9.5px/1 var(--f-mono);letter-spacing:.16em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.cur .act-l{color:var(--hero-hi)}
.act-segs{display:flex;gap:3px;height:12px;align-items:center}
.seg{flex:1 1 0;height:6px;border-radius:3px;background:rgba(160,175,220,.2);position:relative;cursor:pointer;overflow:hidden;border:0;padding:0;transition:height .2s}
.seg:hover,.seg:focus-visible{height:10px;outline:none;background:rgba(160,175,220,.35)}
.seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hero);border-radius:3px}
.seg.done i{width:100%;background:color-mix(in srgb,var(--hero) 50%,transparent)}
.counter{font:600 12px/1 var(--f-mono);color:var(--mist);white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 4px}
.counter b{color:var(--cream)}
.vc{position:relative;flex:none}
#b-voice .vx{display:none}
#b-voice[aria-pressed="false"] .vw{display:none}
#b-voice[aria-pressed="false"] .vx{display:inline}
#b-voice.rest .vw{opacity:.3}
#b-voice.talk .vw1{animation:vwave 1.1s ease-in-out infinite}
#b-voice.talk .vw2{animation:vwave 1.1s ease-in-out .18s infinite}
@keyframes vwave{0%,100%{opacity:1}50%{opacity:.3}}
#vhint{position:absolute;bottom:calc(100% + 10px);left:50%;background:rgba(9,14,28,.96);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;font:500 11.5px/1.2 var(--f-mono);color:var(--cream);white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,6px);transition:opacity .18s ease,transform .22s;z-index:32}
#vhint.show{opacity:1;transform:translate(-50%,0)}
.spd{position:relative;flex:none}
#b-speed{min-width:54px;font-variant-numeric:tabular-nums}
#speedpop{position:absolute;bottom:calc(100% + 10px);left:50%;display:flex;flex-direction:column-reverse;gap:2px;padding:5px;background:rgba(9,14,28,.96);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,8px);pointer-events:none;visibility:hidden;transition:opacity .18s ease,transform .22s,visibility 0s linear .22s;z-index:32}
#speedpop.open{opacity:1;transform:translate(-50%,0);pointer-events:auto;visibility:visible;transition-delay:0s}
#speedpop button{height:30px;min-width:58px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--mist);font:600 12px/1 var(--f-mono);cursor:pointer;font-variant-numeric:tabular-nums}
#speedpop button:hover,#speedpop button:focus-visible{background:rgba(27,38,69,.9);color:var(--cream);outline:none}
#speedpop button[aria-checked="true"]{background:var(--hero);color:var(--hero-ink)}
#tip{position:absolute;bottom:58px;transform:translateX(-50%);background:rgba(9,14,28,.94);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;font:500 11.5px/1.2 var(--f-mono);color:var(--cream);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:31}
#tip.show{opacity:1}

/* ---------- scenes menu ---------- */
#menu{position:absolute;inset:0;z-index:50;background:rgba(4,7,15,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 28px) var(--gutter) calc(env(safe-area-inset-bottom,0px) + 28px);overflow:auto;opacity:0;pointer-events:none;transition:opacity .3s ease}
#menu.open{opacity:1;pointer-events:auto}
.mh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;max-width:1240px;width:100%;margin:0 auto 20px}
.mh h2{font:700 clamp(22px,2.4vw,36px)/1.05 var(--f-display);margin:0}
.mh p{margin:6px 0 0;color:var(--mist);font:italic 400 17px/1.4 var(--f-narr)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;max-width:1240px;width:100%;margin:0 auto}
.mcard{text-align:left;cursor:pointer;border:1px solid var(--line);background:rgba(17,26,48,.7);border-radius:12px;padding:12px 14px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcard:hover,.mcard:focus-visible{border-color:var(--hero);outline:none;background:rgba(27,38,69,.85)}
.mcard.cur{border-color:var(--hero);box-shadow:0 0 0 1px var(--hero) inset}
.mcard .mn{font:700 10.5px/1 var(--f-mono);letter-spacing:.14em;color:var(--hero-hi)}
.mcard .mt{font:600 14px/1.2 var(--f-display);color:var(--cream)}
.mcard .ms{font:400 14px/1.35 var(--f-narr);color:var(--mist)}
.keys{max-width:1240px;width:100%;margin:22px auto 0;display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mist);font:500 12px/1.6 var(--f-mono)}

/* ---------- toast / fade / boot ---------- */
#toast{position:absolute;left:calc((100% - var(--dock-w) - var(--gutter) * 2) / 2);top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-12px);z-index:35;display:flex;align-items:center;gap:12px;background:rgba(14,21,40,.94);border:1px solid color-mix(in srgb,var(--hero) 55%,transparent);border-radius:12px;padding:10px 16px 10px 12px;box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.4,.4,1)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.nodock #toast{left:50%}
#toast .tk{font:700 10px/1 var(--f-mono);letter-spacing:.16em;color:var(--hero-hi);text-transform:uppercase}
#toast .tt{font:600 14px/1.1 var(--f-display);color:var(--cream)}
#toast .chip{font:700 11px/1 var(--f-mono);background:var(--hero);color:var(--hero-ink);border-radius:6px;padding:7px 8px}
#fade{position:absolute;inset:0;background:var(--ink-0);opacity:1;pointer-events:none;transition:opacity .4s ease;z-index:45}
#fade.clear{opacity:0}
#boot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:46;font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mist);display:flex;align-items:center;gap:10px;transition:opacity .4s}
#boot.gone{opacity:0;pointer-events:none}
#boot i{width:8px;height:8px;background:var(--hero);border-radius:2px;animation:bootb 1s ease-in-out infinite}
@keyframes bootb{50%{transform:translateY(-6px)}}

/* ---------- responsive: phones get a scrolling column (stage, subtitles, board) ---------- */
@media (max-width:1180px){ .concepts{display:none} }
@media (max-width:900px){
  :root{--dock-w:auto;--b-size:13px}
  body{overflow-x:hidden;overflow-y:auto}
  #app{position:relative;inset:auto;min-height:100%;overflow:visible;display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
  #stage{position:relative;inset:auto;height:min(56vh,520px);min-height:320px;flex:none}
  .brand span{display:none}
  .hud-scene{border-left:0;padding-left:0}
  #titlecard{position:absolute;top:min(30vh,240px);bottom:auto;transform:none;width:auto;right:var(--gutter)}
  .tc-title,#titlecard.hero .tc-title{font-size:clamp(28px,8.6vw,44px)}
  .tc-sub{font-size:17px}
  #narration,.nodock #narration{position:relative;left:auto;bottom:auto;width:auto;padding:14px var(--gutter) 4px;min-height:5.2em}
  .nl{font-size:19px;text-shadow:none}
  #dock{position:relative;right:auto;top:auto;bottom:auto;width:auto;margin:10px var(--gutter) 0;height:auto}
  .board{height:min(60vh,520px);flex:none}
  .bd-title{padding-right:0}
  #transport{position:fixed;background:linear-gradient(to top,rgba(5,9,19,.97) 60%,rgba(5,9,19,0));flex-wrap:wrap;row-gap:8px}
  .timeline .act-l{display:none}
  .timeline{order:-1;flex:1 0 100%;height:12px;padding:0 2px;gap:5px}
  #b-next{margin-right:auto}
  #b-full,#b-auto .lab,#b-voice .lab,#b-menu .lab{display:none}
  .idle #transport{opacity:1}
  .idle{cursor:auto}
  #toast,.nodock #toast{left:50%}
  .nodock #dock{display:none}
  .rc-on #narration{display:none}
  #recap{position:relative;right:auto;top:auto;bottom:auto;width:auto;margin:12px var(--gutter) 0;overflow:visible}
  .rc-grid{display:block}
  .rc-row{display:grid;grid-template-columns:48px minmax(0,1fr);row-gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rc-row>span{padding:0;border:0;animation:none}
  .rc-c{grid-row:1 / span 3;align-items:flex-start}
  .rc-n,.rc-w,.rc-t{grid-column:2}
  .rc-n{white-space:normal}
  .rc-t .kb{white-space:normal;overflow-wrap:anywhere}
  #recap{min-width:0;max-width:calc(100% - var(--gutter) * 2)}
  .rc-grid,.rc-row>span,.rc-head>div{min-width:0}
  .rc-head h2{overflow-wrap:anywhere}
}
@media (max-width:480px){
  .counter{display:none}
  .tag{font-size:10px;padding:5px 7px}
  .bubble{font-size:12px}
  .chipd .t{display:none}
}
@media (prefers-reduced-motion:reduce){
  .ln,.lbl>.in,.nl,#titlecard.show>*,#titlecard.hide>*,.rc-row>span,#recap{animation-duration:.01s!important;transition-duration:.01s!important}
  #b-voice.talk .vw{animation:none}
}
/* Codex CLI skin for the board, copied from the real TUI (see reference/codex-tui.md) */
.board.cx{background:rgba(5,5,7,.97);border-color:rgba(255,255,255,.12);border-radius:10px}
.cx .bd-bar{background:#141416;border-bottom-color:rgba(255,255,255,.08);color:#9a9aa2}
.cx .bd-body{padding:14px 18px 10px}
.cx .bd-log{font:400 var(--b-size)/1.5 var(--f-mono);color:#d6d6d6;gap:.32em}
.cx .ln{animation-duration:.18s}
.cx .bi-rule{display:none}
.cx .bi-line{background:#151517;border-radius:4px;padding:.55em .7em;margin-top:.3em}
.cx .bi-caret{color:#d6d6d6;font-weight:700}
.cx .bi-text.ph{color:#6c6c74}
.cx .bi-cursor{background:#d6d6d6}
.cx .bd-foot{padding:.45em .7em 0;line-height:1.55;color:#7c7c84}
.cx-model{color:#f6e2b7}.cx-cwd{color:#abdfa7}.cx-thread{color:#f5e0dc}
.cx-badge{float:right;color:#d38cf0}
.cx-hint{color:#6c6c74}
.cx-hint b{color:#9a9aa2;font-weight:700}
/* header */
.cx-hdr{color:#d6d6d6;line-height:1.55;margin-bottom:.5em}
.cx-mark{color:#63a8f8;font-weight:700}
.cx-hdr b{color:#fff}
.cx .d,.cx-d{color:#7c7c84}
.cx-yolo{color:#d33fd3;font-weight:700}
/* rows */
.cx-user{color:#e8e8e8;background:#151517;border-radius:4px;padding:.3em .6em;margin:.25em 0}
.cx-user .chev{color:#8a8a92;font-weight:700;margin-right:.6ch}
.cx-row{display:flex;gap:1ch}
.cx-row>.dot{flex:none;font-weight:700;color:#f2f2f2}
.cx-row.ok>.dot{color:#5fd068}
.cx-row.err>.dot{color:#ff6b6b}
.cx-row.dim>.dot{color:#808080}
.cx-row .tx{min-width:0;overflow-wrap:anywhere}
.cx-row b{color:#fff;font-weight:700}
.cx-sub{padding-left:2ch;color:#a8a8b0;overflow-wrap:anywhere}
.cx-sub .el{color:#6c6c74}
.cx-sub.err{color:#ff8a8a}
.cx-more{padding-left:4ch;color:#6c6c74}
.cx-worked{padding-left:2ch;color:#6c6c74}
.cx-body{padding-left:2ch}
.cx-agent{color:#63a8f8}
/* shell highlight (catppuccin-like, as Codex renders it) */
.sh-c{color:#89b4fa}.sh-a{color:#cdd6f4}.sh-f{color:#eba0ac}.sh-s{color:#a6e3a1}.sh-p{color:#94e2d5}
/* working line */
.cx-work .dot{animation:cxPulse 1s ease-in-out infinite}
.cx-work .tx{color:#7c7c84}.cx-work .tx b{color:#a8a8b0}
@keyframes cxPulse{0%,100%{color:#808080}50%{color:#f2f2f2}}
/* diffs */
.cx-diff{font-size:.94em}
.cx-diff .r{display:flex;gap:1ch;padding-left:3ch}
.cx-diff .n{color:#6c6c74;min-width:2ch;text-align:right}
.cx-diff .r.add{background:#213a2b}.cx-diff .r.del{background:#4a221d}
.cx-diff .r.add .s{color:#5fd068}.cx-diff .r.del .s{color:#ff6b6b}
.cx-diff .hunk{color:#3fc1c9;padding-left:3ch}
.cx-plus{color:#5fd068}.cx-minus{color:#ff6b6b}
/* menus */
.cx-menu{margin:.3em 0;line-height:1.6}
.cx-menu .t{color:#fff;font-weight:700}
.cx-menu .o{display:flex;gap:1.5ch;padding:0 .4ch}
.cx-menu .o .l{flex:none;min-width:17ch}
.cx-menu .o.sel{background:#d6d6d6;color:#000}
.cx-menu .o.sel .ds{color:#222}
.cx-menu .o .ds{color:#8a8a92}
.cx-menu .h{color:#6c6c74}
.cx-marker{color:#63a8f8}
.cx-goal .o{color:#7c7c84}
.cx-tbl{display:grid;grid-template-columns:max-content 1fr;gap:0 2ch;padding-left:2ch;color:#a8a8b0}
.cx-ok{color:#5fd068}.cx-no{color:#7c7c84}.cx-warn{color:#c4a767}

</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl" aria-label="Animated 3D scene"></canvas>
    <div id="labels"></div>
    <div class="vignette"></div>
  </div>

  <header id="hud">
    <div class="brand" id="brand"><i class="mark"></i><span id="brand-t"></span></div>
    <div class="hud-scene"><b id="hud-num">00</b><span id="hud-title"></span></div>
    <div class="hud-right">
      <div class="chipd" id="chipd" hidden><span class="sun"></span><span class="d" id="chip-d"></span><span class="t" id="chip-t"></span></div>
      <div class="concepts" id="concepts"></div>
    </div>
  </header>

  <section id="titlecard" aria-live="polite">
    <div class="tc-eyebrow" id="tc-eyebrow"></div>
    <h1 class="tc-title" id="tc-title"></h1>
    <p class="tc-sub" id="tc-sub"></p>
    <div class="tc-cta" id="tc-cta" hidden></div>
  </section>

  <div id="narration" aria-live="polite"></div>

  <aside id="dock">
    <div class="board m-notes" id="board">
      <div class="bd-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="bd-title" id="bd-title"></span></div>
      <div class="bd-body">
        <div class="bd-scroll" id="bd-scroll"><div class="bd-log" id="bd-log"></div></div>
        <div class="bd-input" id="bd-input" hidden>
          <div class="bi-rule"></div>
          <div class="bi-line"><span class="bi-caret">&gt;</span><span class="bi-text" id="bi-text"></span><span class="bi-cursor" aria-hidden="true"></span></div>
          <div class="bi-rule"></div>
          <div class="bd-foot" id="bd-foot"></div>
        </div>
      </div>
    </div>
    <div class="takeaway" id="takeaway" hidden></div>
  </aside>

  <section id="recap" aria-label="Recap" hidden></section>

  <footer id="transport">
    <button class="tbtn" id="b-prev" aria-label="Previous scene" title="Previous scene (←)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 3h2v10H3zM13 3v10L6 8z"/></svg></button>
    <button class="tbtn" id="b-play" aria-label="Pause" title="Play / pause (Space)"><svg viewBox="0 0 16 16" fill="currentColor" id="i-play"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
    <button class="tbtn" id="b-next" aria-label="Next scene" title="Next scene (→)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M11 3h2v10h-2zM3 3v10l7-5z"/></svg></button>
    <div class="timeline" id="timeline"></div>
    <span class="counter" id="counter"><b>00</b> / 00</span>

<script type="module">

/* ============================================================
   core: utilities, director clock, board, narration, voice, UI pieces
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let STORE_NS = 'film';
const store = {
  get(k, d) { try { const v = localStorage.getItem(STORE_NS + '.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(STORE_NS + '.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

const E = {
  linear: k => k,
  inQuad: k => k * k,
  outQuad: k => k * (2 - k),
  inOutQuad: k => (k < .5 ? 2 * k * k : -1 + (4 - 2 * k) * k),
  inCubic: k => k * k * k,
  outCubic: k => 1 - Math.pow(1 - k, 3),
  inOutCubic: k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  outQuart: k => 1 - Math.pow(1 - k, 4),
  inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  outSine: k => Math.sin((k * Math.PI) / 2),
  walk: k => { const a = .15, d = 2 * a * (1 - a); return k < a ? k * k / d : k > 1 - a ? 1 - (1 - k) * (1 - k) / d : (k - a / 2) / (1 - a); },
  inBack: k => { const c1 = 1.70158, c3 = c1 + 1; return c3 * k * k * k - c1 * k * k; },
  outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  outElastic: k => (k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI) / 3) + 1),
  outBounce: k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; },
};

/* ---------- Director: a pausable scene clock that drives every scripted wait and animation ----------
   Everything time-based in a scene goes through D (wait/anim/until), never setTimeout, so pause,
   speed and scene jumps stay exact. */
const D = {
  t: 0, playing: true, speed: 1, token: 0, seq: 0, timers: [], anims: [],
  wait(sec) {
    return new Promise(res => {
      if (!(sec > 0)) { res(); return; }
      this.timers.push({ at: this.t + sec, res, seq: this.seq++ });
    });
  },
  animate(dur, fn, ease = E.inOutCubic) {
    return new Promise(res => {
      if (!(dur > 0)) { fn(1); res(); return; }
      this.anims.push({ start: this.t, dur, fn, ease, res });
      fn(0);
    });
  },
  step(dt) {
    if (!this.playing) return 0;
    const sdt = dt * this.speed;
    this.t += sdt;
    if (this.anims.length) {
      const done = [];
      for (const a of this.anims) {
        const k = clamp((this.t - a.start) / a.dur, 0, 1);
        a.fn(a.ease(k));
        if (k >= 1) done.push(a);
      }
      if (done.length) { this.anims = this.anims.filter(a => !done.includes(a)); done.forEach(a => a.res()); }
    }
    if (this.timers.length) {
      const due = this.timers.filter(tm => tm.at <= this.t);
      if (due.length) {
        this.timers = this.timers.filter(tm => tm.at > this.t);
        due.sort((a, b) => a.at - b.at || a.seq - b.seq).forEach(tm => tm.res());
      }
    }
    return sdt;
  },
  // pending promises from the old scene are simply never resolved; the token lets loops notice
  reset() { this.token++; this.timers = []; this.anims = []; this.t = 0; },
};
const wait = s => D.wait(s);
const anim = (dur, fn, ease) => D.animate(dur, fn, ease);
const until = t => wait(t - D.t);
const all = (...p) => Promise.all(p.flat());
const run = fn => fn();                      // start a parallel track: run(async () => {...})
function cue() { let r; const p = new Promise(res => (r = res)); p.fire = () => r(); return p; }
const TYPE_PACE = 1.3;
async function typeOn(s, cps, show, { space = 1, jit = [.6, 1.35] } = {}) {
  const n = s.length, at = [0];
  for (let i = 0; i < n; i++) at.push(at[i] + (TYPE_PACE / cps) * (s[i] === ' ' ? space : 1) * rand(jit[0], jit[1]));
  const t0 = D.t;
  let shown = 0;
  while (shown < n) {
    let k = shown;
    while (k < n && at[k] <= D.t - t0) k++;
    if (k > shown) { shown = k; show(s.slice(0, shown)); }
    if (shown < n) await wait(at[shown] - (D.t - t0));
  }
  await wait(at[n] - (D.t - t0));
}

/* ---------- tiny markup for board strings ----------
   **bold**  `code`  *em*  [g]green[/] [r]red[/] [b]blue[/] [v]violet[/] [t]teal[/] [y]yellow[/] [o]hero[/] [d]dim[/] [w]white[/] */
function fmt(s) {
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  h = h.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\[(g|r|d|o|t|v|y|b|w)\]([\s\S]*?)\[\/\]/g, '<span class="c-$1">$2</span>');
  return h;
}
const kb = s => `<kbd>${esc(s)}</kbd>`;
const kc = s => `<span class="kb">${esc(s)}</span>`;

/* ---------- Board: the docked panel. 'notes' mode for lessons, 'term' mode for command-line stories ---------- */
const SPIN_GLYPHS = ['·', '✢', '✳', '✶', '✻', '✽', '✻', '✶', '✳', '✢'];
const Board = (() => {
  const boardEl = $('#board'), logEl = $('#bd-log'), scrollEl = $('#bd-scroll'), inputWrap = $('#bd-input'), tiText = $('#bi-text'), titleEl = $('#bd-title'), footEl = $('#bd-foot');
  const spinners = new Set();
  const scrollDown = () => { scrollEl.scrollTop = scrollEl.scrollHeight; scrollEl.classList.toggle('over', scrollEl.scrollHeight > scrollEl.clientHeight + 2); };
  try { new ResizeObserver(() => scrollDown()).observe(scrollEl); } catch (e) { /* no ResizeObserver */ }
  const add = (cls, html) => {
    const el = document.createElement('div');
    el.className = 'ln ' + cls;
    el.innerHTML = html;
    logEl.appendChild(el);
    while (logEl.children.length > 160) logEl.firstChild.remove();
    requestAnimationFrame(scrollDown);
    return el;
  };
  const subs = lines => [].concat(lines).map((l, i) => `<div class="sub"><span class="el">${i === 0 ? '⎿' : ''}</span><span class="tx">${fmt(l)}</span></div>`).join('');
  const B = {
    el: boardEl,
    title(s) { titleEl.textContent = s; },
    mode(m) { boardEl.classList.toggle('m-notes', m !== 'term'); boardEl.classList.toggle('m-term', m === 'term'); B.cur = m; },
    reset({ title = '', mode = 'notes', input = false } = {}) { logEl.innerHTML = ''; spinners.clear(); tiText.textContent = ''; footEl.innerHTML = ''; B.input(input); B.mode(mode); B.title(title); },
    // a status line under the input (model, folder, mode…), as many CLIs show; trusted HTML
    footer(html) { footEl.innerHTML = html || ''; },
    clear() { logEl.innerHTML = ''; spinners.clear(); },
    input(on) { inputWrap.hidden = !on; },
    raw: (html, cls = '') => add(cls, html),
    // ---- lesson notes ----
    k: s => add('k', fmt(s)),                         // small uppercase kicker
    h: s => add('h', fmt(s)),                         // heading
    p: s => add('p', fmt(s)),                         // paragraph
    li: (s, cls = '') => add('li ' + cls, `<span>${fmt(s)}</span>`),   // bullet; cls: ok | bad | dim
    step: (n, s) => add('step', `<span class="n">${esc(n)}</span><span>${fmt(s)}</span>`),
    def: (term, s) => add('def', `<span class="t">${esc(term)}</span><span>${fmt(s)}</span>`),
    math: html => add('math', html),                  // trusted HTML: H<sub>2</sub>O, x<sup>2</sup>, →
    quote: s => add('quote', fmt(s)),
    kv: rows => add('kv', rows.map(([k, v]) => `<span class="k">${esc(k)}</span><span>${fmt(v)}</span>`).join('')),
    hr: () => add('hr', ''),
    media: html => add('media', html),                // inline SVG or small diagram
    // write a line with a typewriter, for notes that should feel written live
    async write(s, { as = 'p', cps = 40 } = {}) {
      const el = add(as === 'li' ? 'li' : as, as === 'li' ? '<span></span>' : '');
      const tgt = as === 'li' ? el.firstChild : el;
      await typeOn(s, cps, t => { tgt.innerHTML = fmt(t); requestAnimationFrame(scrollDown); }, { space: .6 });
      return el;
    },
    mark(el) { el.classList.remove('hl'); void el.offsetWidth; el.classList.add('hl'); },
    // code: rows of strings or [text, kind] where kind = add | del | mark; colors via [g]..[/] tags
    code(rows, { title = '' } = {}) {
      const body = [].concat(rows).map(r => { const [t, k] = Array.isArray(r) ? r : [r, '']; return `<span class="row ${k || ''}">${fmt(t) || ' '}</span>`; }).join('');
      return add('code', (title ? `<div class="ct">${esc(title)}</div>` : '') + `<pre>${body}</pre>`);
    },
    // ---- terminal ----
    user: s => add('user', `<span class="gt">&gt;</span>${fmt(s)}`),
    say: s => add('say', `<span class="b">⏺</span><span class="tx">${fmt(s)}</span>`),
    out: lines => add('tight', subs(lines)),
    shellLine: (cwd, s) => add('shell', `<span class="ps"><b>${esc(cwd)}</b> ❯</span> ${fmt(s)}`),
    tool(name, arg, o = {}) {
      const el = add('tool run' + (o.cls ? ' ' + o.cls : ''), `<div class="hd"><span class="b">⏺</span><span class="tx"><span class="tn"${o.color ? ` style="color:${o.color}"` : ''}>${esc(name)}</span>${arg != null ? `(${fmt(arg)})` : ''}</span></div><div class="subs"></div>`);
      const sb = el.querySelector('.subs');
      const h = {
        el,
        sub(lines) { sb.innerHTML = subs(lines); requestAnimationFrame(scrollDown); return h; },
        ok(lines) { el.classList.remove('run'); el.classList.add('ok'); if (lines != null) h.sub(lines); return h; },
        err(lines) { el.classList.remove('run'); el.classList.add('err'); if (lines != null) h.sub(lines); return h; },
      };
      if (o.done) h.ok(o.done);
      return h;
    },
    did(name, arg, result) { return B.tool(name, arg, { done: result }); },
    spin(verb, secs, o = {}) {
      const el = add('spin', `<span class="g">✻</span> <span class="v">${esc(verb)}…</span> <span class="m"></span>`);
      const s = { el, g: el.querySelector('.g'), m: el.querySelector('.m'), t0: D.t, extra: o.extra || '' };
      spinners.add(s);
      const done = () => { spinners.delete(s); el.remove(); };
      if (secs == null) return { stop: done };
      return wait(secs).then(done);
    },
    async type(s, { cps = 34, submit = true, pause = .32 } = {}) {
      B.input(true); tiText.textContent = ''; tiText.classList.remove('ph');
      await typeOn(s, cps, txt => (tiText.textContent = txt), { space: .55 });
      if (!submit) return;
      await wait(pause);
      tiText.textContent = '';
      return B.user(s);
    },
    placeholder(s) { B.input(true); tiText.textContent = s; tiText.classList.add('ph'); },
    // type into the input line without echoing a log entry; returns when typed. Clear with placeholder()
    typeOnly(s, o = {}) { return B.type(s, { ...o, submit: false }); },
    tick() {
      for (const s of spinners) {
        s.g.textContent = SPIN_GLYPHS[Math.floor(D.t * 9) % SPIN_GLYPHS.length];
        s.m.textContent = `(${Math.max(1, Math.floor(D.t - s.t0 + 1))}s${s.extra ? ' · ' + s.extra : ''})`;
      }
    },
  };
  return B;
})();

/* ---------- Quiz: a question on the board. Waits for a click; in auto mode it reveals itself after `timeout` ---------- */
const Quiz = {
  async ask({ q, choices, answer = 0, explain = '', timeout = 10, kicker }) {
    const L = 'ABCDEFGH';
    const el = Board.raw(`<div class="qk">${esc(kicker || UI.quiz)}</div><div class="qq">${fmt(q)}</div><div class="qc">${choices.map((c, i) => `<button data-i="${i}"><span class="l">${L[i]}</span><span>${fmt(c)}</span></button>`).join('')}</div><div class="qt"><i></i></div><div class="qx" hidden>${fmt(explain)}</div>`, 'quiz');
    const bar = el.querySelector('.qt i'), btns = [...el.querySelectorAll('button')];
    const tok = D.token, t0 = D.t;
    let picked = -1, done = false;
    const answered = cue();
    btns.forEach(b => b.addEventListener('click', () => { if (done) return; picked = +b.dataset.i; answered.fire(); }));
    // countdown only matters when the film advances on its own
    run(async () => {
      while (!done && D.token === tok) {
        const k = clamp((D.t - t0) / timeout, 0, 1);
        bar.style.transform = `scaleX(${Show.auto ? 1 - k : 1})`;
        if (Show.auto && k >= 1) { answered.fire(); break; }
        await wait(.05);
      }
    });
    await answered;
    done = true;
    el.querySelector('.qt').remove();
    btns.forEach((b, i) => { b.disabled = true; if (i === answer) b.classList.add('right'); else if (i === picked) b.classList.add('wrong'); });
    if (explain) el.querySelector('.qx').hidden = false;
    requestAnimationFrame(() => { const s = $('#bd-scroll'); s.scrollTop = s.scrollHeight; });
    const correct = picked === answer;
    if (picked >= 0) store.set('quiz.' + Show.i, correct);
    return { picked, correct, revealed: picked < 0 };
  },
};

/* ---------- Narration (film subtitles) ---------- */
const Narr = {
  el: $('#narration'),
  set(html) {
    this.el.querySelectorAll('.nl').forEach(old => {
      if (old.classList.contains('out')) return;
      old.classList.remove('in'); old.classList.add('out');
      setTimeout(() => old.remove(), 600);
    });
    Voice.say(html);
    if (!html) return;
    this.at = D.t; this.len = readTime(html);
    const p = document.createElement('p');
    p.className = 'nl';
    p.innerHTML = html;
    this.el.appendChild(p);
    requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('in')));
  },
  clear() { this.el.innerHTML = ''; this.at = this.len = this.until = 0; Voice.stop(); },
  busy() { return Math.max(this.until || 0, (this.at || 0) + (this.len || 0), Voice.end()); },
};
const plainText = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g, ' ').trim(); };
// reading time when there is no clip; with a clip, a beat lasts as long as the voice plus a breath
const readTime = html => 1.6 + plainText(html).split(/\s+/).length * .32;
// a narration beat: show a line, then hold until it has been heard (or read) and `hold` has passed
async function N(html, hold) {
  Narr.set(html);
  const e = VO[plainText(html)];
  const h = Math.max(hold ?? 0, e && Voice.on && D.speed <= Voice.MAX ? e[1] + .45 : hold ?? readTime(html));
  Narr.until = D.t + h;
  await wait(h);
}

// a beat: start the visuals for a line in parallel, then hold for the line. Keeps pictures on the words
// even when a re-voiced clip gets longer or shorter. beat('line', async () => { ...visuals... })
async function beat(html, fn, hold) { if (fn) run(fn); await N(html, hold); }

/* ---------- Narrator voice: one pre-rendered clip per line, kept on the scene clock ---------- */
const Voice = {
  on: true, MAX: 2, cur: null, els: [], live: null, hold: false, blocked: false, primed: false, ui: null,
  init() {
    this.on = store.get('voice', true);
    this.order = {};
    for (const k in VO) { const [id, , sc] = VO[k]; (this.order[sc] ||= []).push(id); }
    for (let i = 0; i < 2; i++) {
      const a = new Audio(); a.preload = 'auto';
      ['playing', 'pause', 'ended'].forEach(ev => a.addEventListener(ev, () => this.ui && this.ui()));
      this.els.push(a);
    }
    const g = () => this.gesture();
    ['pointerdown', 'keydown', 'touchend'].forEach(ev => addEventListener(ev, g, { capture: true, passive: true }));
    document.addEventListener('visibilitychange', () => this.sync());
  },
  src(a, id) { if (a.dataset.id !== id) { a.dataset.id = id; a.src = `vo/${id}.mp3`; } return a; },

  surprised: { eyeY: 1.3, brow: 0,    browY: .05, mouth: 'o' },
  worried:   { eyeY: 1,   brow: -.35, browY: .02, mouth: 'flat' },
  focused:   { eyeY: .7,  brow: .22,  browY: -.02, mouth: 'flat' },
  thinking:  { eyeY: .85, brow: .15,  browY: .03, mouth: 'flat', look: [.45, .55] },
  sad:       { eyeY: .9,  brow: -.45, browY: 0,   mouth: 'frown' },

      frown: mesh(torus(.07, .016, 6, 20, Math.PI), mouthMat, { y: -.17, parent: face, cast: false }),

/* ---------- world setup ---------- */

  sky.renderOrder = -10; scene.add(sky); W.skyMat = skyMat;
  { // stars
    const n = 1100, pos = new Float32Array(n * 3);

function setSky(name, dur = 1.6) {
  if (!W.ok) return Promise.resolve();
  const p = SKY[name] || SKY.night, u = W.skyMat.uniforms;
  const from = { top: u.top.value.clone(), mid: u.mid.value.clone(), bot: u.bot.value.clone(), glow: u.glow.value.clone(), gk: u.gk.value, fog: W.scene.fog.color.clone(), key: W.key.color.clone(), keyI: W.key.intensity, rim: W.rim.color.clone(), rimI: W.rim.intensity, hemi: W.hemi.color.clone(), hemiI: W.hemi.intensity, stars: W.stars.material.opacity, exp: W.renderer.toneMappingExposure };
  const C = h => new THREE.Color(h);
  const to = { top: C(p.top), mid: C(p.mid), bot: C(p.bot), glow: C(p.glow), fog: C(p.fog), key: C(p.key), rim: C(p.rim), hemi: C(p.hemi) };
  const apply = k => {
    u.top.value.lerpColors(from.top, to.top, k); u.mid.value.lerpColors(from.mid, to.mid, k); u.bot.value.lerpColors(from.bot, to.bot, k);
    u.glow.value.lerpColors(from.glow, to.glow, k); u.gk.value = lerp(from.gk, p.gk, k);
    W.scene.fog.color.lerpColors(from.fog, to.fog, k);
    W.key.color.lerpColors(from.key, to.key, k); W.key.intensity = lerp(from.keyI, p.keyI, k);
    W.rim.color.lerpColors(from.rim, to.rim, k); W.rim.intensity = lerp(from.rimI, p.rimI, k);
    W.hemi.color.lerpColors(from.hemi, to.hemi, k); W.hemi.intensity = lerp(from.hemiI, p.hemiI, k);
    W.stars.material.opacity = lerp(from.stars, p.stars, k);
    W.renderer.toneMappingExposure = lerp(from.exp, p.exp, k);
  };
  if (!(dur > 0)) { apply(1); return Promise.resolve(); }
  return anim(dur, apply, E.inOutSine);
}
const sky = (n, d = 2) => setSky(n, d);

function gridTexture() {
  return canvasTex(1024, 1024, (c, w, h) => {
    const n = 24, s = w / n;
    c.strokeStyle = 'rgba(150,175,245,.075)'; c.lineWidth = 2;
    for (let i = 1; i < n; i++) { c.beginPath(); c.moveTo(i * s, 0); c.lineTo(i * s, h); c.stroke(); c.beginPath(); c.moveTo(0, i * s); c.lineTo(w, i * s); c.stroke(); }
    for (let k = 0; k < 16; k++) { const x = Math.floor(Math.random() * n), y = Math.floor(Math.random() * n); c.fillStyle = Math.random() < .55 ? 'rgba(217,119,87,.035)' : 'rgba(111,227,208,.03)'; c.fillRect(x * s + 3, y * s + 3, s - 6, s - 6); }
  });
}
function makeIsland({ size = 10, trim = HERO, trimK = 1.5, tiers = true } = {}) {
  const g = new THREE.Group();

  const plane = new THREE.Mesh(new THREE.PlaneGeometry(size - .3, size - .3), new THREE.MeshBasicMaterial({ map: gridTexture(), transparent: true, depthWrite: false }));
  plane.rotation.x = -Math.PI / 2; plane.position.y = .004; g.add(plane);
  const tm = glow(trim, trimK), L = size - .5, o = L / 2;
  [[0, o, L, .035], [0, -o, L, .035], [o, 0, .035, L], [-o, 0, .035, L]].forEach(([x, z, w, d]) => mesh(box(w, .012, d), tm, { x, y: .007, z, cast: false, parent: g }));
  if (tiers) {

function makeWord(text, { color = '#f3ede3', size = .42, font = FONT_D, weight = 700, bg = null, pad = .18 } = {}) {

  });

// a bar chart: values 0..1; userData.grow(dur), userData.set(values, dur)
function makeBars(values, { colors = [HERO, SIGNAL, GOLD, VIOLET], w = .34, gap = .14, maxH = 1.8, labels = [] } = {}) {
  const g = new THREE.Group(), bars = [];
  const total = values.length * w + (values.length - 1) * gap;
  values.forEach((v, i) => {
    const b = mesh(rbox(w, 1, w, .04), std(colors[i % colors.length], { rough: .45, emissive: colors[i % colors.length], ei: .12 }), { x: -total / 2 + w / 2 + i * (w + gap), parent: g });
    b.userData.v = 0; b.scale.y = .001; b.position.y = 0; b.visible = false; bars.push(b);
    if (labels[i]) { const L = makeWord(labels[i], { size: .18, font: FONT_M, weight: 600, color: '#a7b0ca' }); L.position.set(b.position.x, -.14, w); g.add(L); }
  });
  const setH = (b, v) => { b.userData.v = v; const h = Math.max(.001, v * maxH); b.scale.y = h; b.position.y = h / 2; b.visible = v > .004; };
  g.userData.bars = bars;
  g.userData.set = (vals, dur = .8) => all(bars.map((b, i) => { const v0 = b.userData.v; return anim(dur, k => setH(b, lerp(v0, vals[i], k)), E.outCubic); }));
  g.userData.grow = (dur = 1) => g.userData.set(values, dur);

}
// a curved tube between two points (a flow, a road, a link); growTube/pulseTube animate it
function makeTube(from, to, { h = 1, r = .035, color = SIGNAL, k = 1.6, seg = 64, head = false } = {}) {
  const a = toV(from), b = toV(to), mid = a.clone().lerp(b, .5); mid.y += h;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const t = new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 8, false), glow(color, k));
  t.userData.curve = curve;
  if (head) {
    const hd = mesh(cone(r * 3.2, r * 7), glow(color, k), { parent: t, cast: false });
    hd.position.copy(b); hd.quaternion.setFromUnitVectors(V(0, 1, 0), curve.getTangent(1).normalize());
    t.userData.head = hd; hd.visible = false;
  }
  t.geometry.setDrawRange(0, 0);
  return t;
}

}

/* ---------- canvas draw recipes for cards ---------- */
function wrapLines(c, text, maxW) {
  const words = String(text).split(' '), out = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line);
  return out;
}

/* ---------- effects ---------- */
const FX = {
  n: 520, parts: [], im: null, m4: null,
  init(scene) {
    this.m4 = new THREE.Matrix4();
    this.im = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ toneMapped: false }), this.n);
    this.im.count = 0; this.im.frustumCulled = false;

  },
  spawn(p) { if (this.parts.length >= this.n) this.parts.shift(); this.parts.push(p); },
  burst(pos, { n = 26, colors = [HERO, GOLD, SIGNAL, CREAM], speed = 2.4, up = 2.6, life = 1.2, size = .075, grav = 7, k = 1.8 } = {}) {
    const P = toV(pos);
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = speed * rand(.35, 1); this.spawn({ p: P.clone(), v: V(Math.cos(a) * s, up * rand(.5, 1.2), Math.sin(a) * s), life, age: 0, size: size * rand(.6, 1.3), grav, c: new THREE.Color(colors[i % colors.length]).multiplyScalar(k), rot: rand(0, 6) }); }
  },
  spark(pos, color = SIGNAL, { life = .5, size = .06, k = 2.2, v = null } = {}) {
    this.spawn({ p: toV(pos), v: v || V(rand(-.15, .15), rand(-.1, .2), rand(-.15, .15)), life, age: 0, size, grav: 0, c: new THREE.Color(color).multiplyScalar(k), rot: rand(0, 6) });
  },
  ring(pos, color = SIGNAL, { r0 = .2, r1 = 2.2, dur = .9, y = .03 } = {}) {
    const m = new THREE.Mesh(torus(1, .02, 4, 64), glow(color, 2.2, { transparent: true, opacity: 1, depthWrite: false }));
    m.rotation.x = Math.PI / 2; const P = toV(pos); m.position.set(P.x, P.y + y, P.z);
    this.rings.add(m);
    return anim(dur, k => { const r = lerp(r0, r1, k); m.scale.set(r, r, r); m.material.opacity = 1 - k; }, E.outCubic).then(() => { this.rings.remove(m); m.material.dispose(); });
  },
  // fly an object along an arc, leaving a glowing trail
  fly(obj, from, to, { h = 1.4, dur = 1.1, color = SIGNAL, trail = true, ease = E.inOutSine, face = false } = {}) {
    const a = toV(from), b = toV(to), mid = a.clone().lerp(b, .5); mid.y += h;

      const p = curve.getPoint(k); obj.position.copy(p);

  },
  clear() { this.parts = []; if (this.im) this.im.count = 0; if (this.rings) this.rings.clear(); },
  update(sdt) {
    if (!this.im) return;

    }

    this.im.instanceMatrix.needsUpdate = true;
    if (this.im.instanceColor) this.im.instanceColor.needsUpdate = true;
  },
};

/* ---------- 3D-anchored HTML labels ---------- */
const Labels = {
  root: $('#labels'), list: [], v: null, visW: 0,
  add(obj, html, { off = [0, 0, 0], cls = 'tag', hidden = false } = {}) {
    const el = document.createElement('div');
    el.className = 'lbl' + (hidden ? ' hide' : '');
    el.innerHTML = `<div class="in ${cls}">${html}</div>`;
    this.root.appendChild(el);
    const L = {
      obj, el, inner: el.firstChild, off: off.isVector3 ? off : V(...off), alive: true,
      set(h) { L.inner.innerHTML = h; return L; },
      show() { el.classList.remove('hide'); return L; },
      hide() { el.classList.add('hide'); return L; },
      remove() { if (!L.alive) return; L.alive = false; el.classList.add('hide'); setTimeout(() => el.remove(), 400); },
    };
    this.list.push(L);
    return L;
  },
  update(camera, w, h) {
    if (!this.v) this.v = V();
    const v = this.v, maxX = Math.min(w, this.visW || w), pad = 8;
    const P = this.list.map(L => {
      if (!L.alive) return null;
      L.obj.getWorldPosition(v); v.add(L.off); v.project(camera);
      let vis = L.obj.visible; for (let o = L.obj.parent; o && vis; o = o.parent) vis = o.visible;
      return { x: (v.x * .5 + .5) * w, y: (-v.y * .5 + .5) * h, off: v.z > 1 || !vis };
    });
    P.forEach((p, i) => { if (p && !p.off && p.x > 0 && p.x < maxX) p.hw = this.list[i].el.offsetWidth / 2; });
    P.forEach((p, i) => {
      if (!p) return;
      const L = this.list[i], x = p.hw ? clamp(p.x, pad + p.hw, Math.max(pad + p.hw, maxX - pad - p.hw)) : p.x;
      L.el.style.transform = `translate3d(${x.toFixed(1)}px,${p.y.toFixed(1)}px,0) translate(-50%,-100%)`;
      L.el.style.visibility = p.off ? 'hidden' : '';
    });
    if (this.list.some(L => !L.alive)) this.list = this.list.filter(L => L.alive);
  },
  clear() { this.list = []; this.root.innerHTML = ''; },
};
function bubble(c, text, dur = 2.4, cls = '') {
  const L = Labels.add(c.head, esc(text), { cls: 'bubble ' + cls });
  if (dur) wait(dur).then(() => L.remove());
  return L;
}
function tag(obj, html, off = [0, 0, 0], cls = 'tag') { return Labels.add(obj, html, { off, cls }); }
function meterOn(obj, title, off = [0, 1.98, 0], cls = 'meter') {
  const L = tag(obj, '', off, cls);

/* ---------- camera ---------- */
const Cam = {
  pos: null, look: null, distK: 1, drift: 1, shakeK: 0, tmp: null,
  init() { this.pos = V(0, 4, 12); this.look = V(0, 1, 0); this.tmp = V(); },
  set(p, l) { this.pos.copy(toV(p)); this.look.copy(toV(l)); },
  to(p, l, dur = 2, ease = E.inOutCubic) {
    const p0 = this.pos.clone(), l0 = this.look.clone(), p1 = toV(p), l1 = toV(l);
    return anim(dur, k => { this.pos.lerpVectors(p0, p1, k); this.look.lerpVectors(l0, l1, k); }, ease);
  },
  orbit(deg, dur = 6, ease = E.inOutSine) {
    const off = this.pos.clone().sub(this.look), r = Math.hypot(off.x, off.z), a0 = Math.atan2(off.x, off.z), y = off.y, L = this.look;
    return anim(dur, k => { const a = a0 + (deg * Math.PI / 180) * k; this.pos.set(L.x + Math.sin(a) * r, L.y + y, L.z + Math.cos(a) * r); }, ease);
  },
  shake(k = .12) { if (!REDUCED) this.shakeK = k; },
  update(time) {
    const c = W.camera, t = this.tmp.copy(this.pos).sub(this.look).multiplyScalar(this.distK).add(this.look);
    if (!REDUCED) { t.x += Math.sin(time * .31) * .07 * this.drift; t.y += Math.sin(time * .23 + 1) * .05 * this.drift; t.z += Math.sin(time * .19 + 2) * .05 * this.drift; }
    if (this.shakeK > .001) { t.x += (Math.random() - .5) * this.shakeK; t.y += (Math.random() - .5) * this.shakeK; this.shakeK *= .88; }
    c.position.copy(t); c.lookAt(this.look);
  },
};

W.tickers = new Set();
function disposeTree(o) {
  o.traverse(n => {
    if (n.material) [].concat(n.material).forEach(m => { if (m.map && m.map.userData && m.map.userData.canvas) m.map.dispose(); if (!Object.values(MAT).includes(m) && !SHARED.has(m)) m.dispose(); });
    if (n.geometry && ![...GEO.values()].includes(n.geometry)) n.geometry.dispose();
  });
}
function resetWorld() {
  if (!W.ok) return;
  for (const c of [...W.chars]) { if (c !== W.guide) { c.root.parent && c.root.parent.remove(c.root); W.chars.delete(c); } }
  W.guide.reset();
  if (W.guide.root.parent !== W.scene) W.scene.add(W.guide.root);
  W.stage.children.slice().forEach(o => { W.stage.remove(o); disposeTree(o); });
  W.tickers.clear(); W.beforeRender = null;
  W.island.visible = true; W.island.position.set(0, 0, 0); W.island.rotation.set(0, 0, 0); W.island.scale.setScalar(1);
  W.deco.visible = true;
  FX.clear(); Labels.clear();
  Cam.drift = 1; Cam.shakeK = 0;
}

/* ---------- the Codex pet: cloud head, >_ screen face, small body ---------- */
const PET_FACE = { neutral: '>_', focused: '>_', happy: '^_^', proud: '^_^', surprised: 'o_o', worried: '>_<', thinking: '·_·', sad: 'T_T' };
function codexPet(g) {
  g.skinned = true;
  g.body.children.forEach(c => { if (!g.arms.includes(c)) c.visible = false; });
  const mat = g.mat;                                   // shared tint, so tint() and minis' colors still work
  mat.roughness = .5; mat.emissive = g.color.clone().multiplyScalar(.28);
  const pet = new THREE.Group(); g.body.add(pet);
  // torso with a >_ print
  mesh(rbox(.46, .34, .34, .13, 3), mat, { y: .37, parent: pet });
  const chest = canvasTex(128, 64, (c, w, h) => { c.fillStyle = '#d9e2ff'; c.font = `700 40px ${FONT_M}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('>_', w / 2, h / 2 + 2); });
  const cp = new THREE.Mesh(new THREE.PlaneGeometry(.2, .1), new THREE.MeshBasicMaterial({ map: chest, transparent: true, toneMapped: false }));
  cp.position.set(0, .37, .172); pet.add(cp);
  // cloud head: one big puff and a ring of smaller ones
  const head = new THREE.Group(); head.position.y = 1.0; pet.add(head);
  const big = mesh(sphere(.4, 28, 20), mat, { parent: head }); big.scale.set(1.18, .92, .9);
  [[-.34, .2, -.02, .25], [.34, .2, -.02, .25], [0, .33, -.04, .27], [-.18, .3, .06, .2], [.18, .3, .06, .2], [-.44, -.08, -.02, .22], [.44, -.08, -.02, .22], [-.3, -.26, 0, .19], [.3, -.26, 0, .19], [0, -.3, 0, .22]]
    .forEach(([x, y, z, r]) => mesh(sphere(r, 20, 14), mat, { x, y, z, parent: head }));
  // the screen
  mesh(rbox(.6, .4, .12, .12, 3), std(0x081026, { rough: .25, metal: .2 }), { y: -.02, z: .36, parent: head });
  let shown = '', cur = true, curT = 0;
  const draw = (txt, on) => (c, w, h) => {
    c.clearRect(0, 0, w, h);
    c.shadowColor = '#6fa4ff'; c.shadowBlur = 6; c.fillStyle = '#c4dbff';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    if (txt === '>_') {                                  // the terminal face: chevron + blinking cursor, drawn apart
      c.font = `700 104px ${FONT_M}`; c.fillText('>', w * .36, h * .5);
      if (on) c.fillRect(w * .52, h * .66, w * .2, 13);
    } else { c.font = `700 84px ${FONT_M}`; c.fillText(txt, w / 2, h / 2 + 4); }
  };
  const tex = canvasTex(256, 160, draw('>_', true));
  const face = new THREE.Mesh(new THREE.PlaneGeometry(.54, .34), new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false }));
  face.position.set(0, -.02, .425); head.add(face);
  const setFace = () => { const t = PET_FACE[g.expr] || '>_'; if (t !== shown) { shown = t; redraw(tex, draw(t, cur)); } };
  g.onExpr = () => setFace();
  // the cursor blinks on real time, like a terminal
  g.onTick = dt => { curT += dt; if (curT > .53) { curT = 0; cur = !cur; if (shown === '>_') redraw(tex, draw('>_', cur)); } head.rotation.z = Math.sin(performance.now() / 900) * .03; };
  // shorter arms and legs under the smaller body
  g.arms.forEach(a => { a.position.set(a.userData.s * .29, .5, 0); a.scale.setScalar(.72); });
  g.legs.forEach(l => { l.position.x = Math.sign(l.position.x) * .13; l.position.y = .18; l.scale.setScalar(.8); });
  g.head.position.y = 1.62;
}

/* ---------- Codex CLI lines (see style.css) ---------- */
const CX = { model: 'GPT-6-Astra high', cwd: '~/shop', thread: 'SHOP-142 discount codes', badge: '' };
const cxFooter = () => Board.footer(`<span class="cx-model">${CX.model}</span> · <span class="cx-cwd">${CX.cwd}</span> · <span class="cx-thread">${esc(CX.thread)}</span>${CX.badge ? `<span class="cx-badge">${esc(CX.badge)}</span>` : ''}<div class="cx-hint"><b>←</b> for agents · <b>?</b> for shortcuts</div>`);
// shell command highlighting, the way Codex colors "• Ran …" lines
function hl(cmd) {
  const out = []; let first = true;
  for (const tok of cmd.match(/'[^']*'|"[^"]*"|&&|\|\||[;|]|\S+/g) || []) {
    if (/^(;|&&|\|\||\|)$/.test(tok)) { out.push(`<span class="sh-p">${esc(tok)}</span>`); first = true; continue; }
    const cls = first ? 'sh-c' : /^['"]/.test(tok) ? 'sh-s' : /^-/.test(tok) ? 'sh-f' : 'sh-a';
    out.push(`<span class="${cls}">${esc(tok)}</span>`); first = false;
  }
  return out.join(' ');
}
const sub = (lines, cls = '') => [].concat(lines).map((l, i) => `<div class="cx-sub ${cls}"><span class="el">${i ? '&nbsp;' : '└'}</span> ${l}</div>`).join('');
function cxHeader(perm = 'Ask for approval') {
  Board.raw(`<div class="cx-hdr"><span class="cx-mark">&gt;_</span> <b>OpenAI Codex</b> <span class="d">(v0.160.1)</span><br><span class="d">&nbsp;&nbsp;&nbsp;${CX.cwd}</span><br>permissions: ${esc(perm)}</div>`);
  Board.placeholder('Ask Codex to do anything'); cxFooter();
}
const cxUser = s => Board.raw(`<span class="chev">›</span>${esc(s)}`, 'cx-user');
const cxSay = (s, cls = '') => Board.raw(`<span class="dot">•</span><span class="tx">${s}</span>`, 'cx-row ' + cls);
const cxAgent = (verb, name) => cxSay(`<b>${verb}</b>${name ? ` <span class="cx-agent">\`${esc(name)}\`</span>` : ''}`);
function cxRan(cmd, out = [], more = 0, cls = 'ok') {
  return Board.raw(`<div class="cx-row ${cls}"><span class="dot">•</span><span class="tx">Ran ${hl(cmd)}</span></div>${out.length ? sub(out.map(esc), cls === 'err' ? 'err' : '') : ''}${more ? `<div class="cx-more">+ ${more} lines (ctrl+t to expand)</div>` : ''}`);
}
// files: [{ p, a, d, rows: [[n, '+'|'-'|' ', code]] }]
function cxEdited(title, files, more = true) {
  const body = files.map(f => `<div class="cx-sub"><span class="el">└</span> ${esc(f.p)} (<span class="cx-plus">+${f.a}</span> <span class="cx-minus">-${f.d}</span>)</div>` +
    (f.rows || []).map(([n, s, code]) => `<div class="r ${s === '+' ? 'add' : s === '-' ? 'del' : ''}"><span class="n">${n}</span><span class="s">${s}</span><span>${esc(code)}</span></div>`).join('')).join('');
  return Board.raw(`<div class="cx-row ok"><span class="dot">•</span><span class="tx">${title}</span></div><div class="cx-diff">${body}</div>${more ? '<div class="cx-more">+ Show details</div>' : ''}`);
}
function cxDone(first, rest = [], worked = '') {
  return Board.raw(`<div class="cx-row"><span class="dot">•</span><span class="tx">${first}</span></div>${rest.map(r => `<div class="cx-body">${r}</div>`).join('')}${worked ? `<div class="cx-worked">Worked for ${worked}</div>` : ''}`);
}
// live "• Working (Ns • esc to interrupt)" line on the scene clock; returns { stop }
function cxWorking() {
  const el = Board.raw('<span class="dot">•</span><span class="tx"></span>', 'cx-row cx-work');
  const tx = el.querySelector('.tx'), t0 = D.t, tok = D.token; let on = true;
  run(async () => { while (on && D.token === tok) { tx.innerHTML = `Working (${Math.max(1, Math.floor(D.t - t0))}s • <b>esc</b> to interrupt)`; await wait(.25); } });
  return { stop() { on = false; el.remove(); } };
}
// type into the composer like a person, then post it as a user message
async function cxType(s, cps = 38) { await Board.typeOnly(s, { cps }); await wait(.25); Board.placeholder('Ask Codex to do anything'); return cxUser(s); }
function cxMenu(title, opts, sel = 0, hint = 'enter select · esc back') {

  if (!W.ok) return;
  W.renderer.setSize(SW, SH, false);
  if (W.composer) { W.composer.setSize(SW, SH); W.composer.setPixelRatio(Math.min(devicePixelRatio || 1, W.lowQ ? 1 : 1.5)); }
  const cam = W.camera;
  cam.aspect = SW / SH;
  const desktop = matchMedia('(min-width: 901px)').matches, nodock = $('#app').classList.contains('nodock') || $('#app').classList.contains('rc-on');
  let shift = 0, effW = SW;
  if (desktop && !nodock) { const left = $('#dock').offsetLeft - $('#stage').offsetLeft; shift = (SW - left) / 2; effW = left; }
  Labels.visW = effW;
  cam.setViewOffset(SW, SH, shift, SH * (desktop ? .045 : .02), SW, SH);
  cam.updateProjectionMatrix();
  Cam.distK = clamp(Math.pow(1.0 / (effW / SH), .9), 1, 2.3);
}

/* ---------- loop ---------- */
const DEV = /[?&]dev/.test(location.search);
let lastT = performance.now(), slowFrames = 0, frames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (Show.pending != null) { const g = Show.pending; Show.pending = null; go(g); }
  const sdt = Show.seeking ? 0 : D.step(dt);
  Board.tick();
  if (W.ok) {
    const time = now / 1000;
    for (const c of W.chars) c.update(dt, sdt, time);
    W.tickers.forEach(f => f(sdt, dt, time));
    FX.update(sdt);
    const dp = W.dust.geometry.attributes.position;
    for (let i = 0; i < dp.count; i++) { let y = dp.getY(i) + dt * .08; if (y > 7) y = -1; dp.setY(i, y); dp.setX(i, dp.getX(i) + Math.sin(time * .5 + i) * dt * .03); }
    dp.needsUpdate = true;
    Cam.update(time);
    W.stage.traverse(o => { if (o.userData.billboard) o.quaternion.copy(W.camera.quaternion); });
    Labels.update(W.camera, SW, SH);
    if (W.beforeRender) W.beforeRender();
    if (W.bloomOn && W.composer) W.composer.render(); else W.renderer.render(W.scene, W.camera);
    frames++;
    if (frames > 90 && !W.lowQ) { if (dt > 1 / 34) slowFrames++; else slowFrames = Math.max(0, slowFrames - 1); if (slowFrames > 45) { W.lowQ = true; W.bloomOn = false; W.renderer.setPixelRatio(1); resize(); console.info('quality lowered'); } }
  }
  progress();
  const s = SCENES[Show.i];
  if (s && Show.done && Show.auto && D.playing && !Show.seeking && !s.hold && D.t - Math.max(Show.endAt, Narr.busy()) > (s.after ?? 1.6) && Show.i < SCENES.length - 1) { Show.done = false; requestGo(Show.i + 1); }
}

/* ---------- dev (?dev): jump to an exact moment, used by scripts/preview.mjs ---------- */
if (DEV) {
  const yieldNow = () => new Promise(r => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });
  window.seek = async (t, pause = true) => {
    Show.seeking = true; Voice.hold = true; D.playing = true;
    const step = 1 / 30;
    while (D.t < t) {
      const sdt = D.step(step);
      if (W.ok) { const time = performance.now() / 1000; for (const c of W.chars) c.update(step, sdt, time); W.tickers.forEach(f => f(sdt, step, time)); FX.update(sdt); }
      Board.tick();
      await yieldNow();
    }
    Show.seeking = false; Voice.hold = false;
    if (pause) togglePlay(false); else Voice.sync();
    return +D.t.toFixed(2);
  };
  Object.assign(window, { S, W, Cam, D, Narr, Voice, Show, SCENES, VO, setSpeed, setVoice, setAuto });
  window.goScene = async (id, t = 0) => { const i = SCENES.findIndex(s => s.id === id); requestGo(i); await sleepReal(900); return t ? window.seek(t) : 0; };
  window.sceneInfo = () => SCENES.map(s => ({ id: s.id, num: s.num, dur: s.dur, hold: !!s.hold }));
}

/* ---------- boot ---------- */
(async function boot() {
  applyFilm();
  Voice.init(); Voice.ui = voiceUI;
  buildUI();
  setSpeed(1);
  const fonts = Promise.race([Promise.all(['700 64px "Unbounded"', '500 40px "JetBrains Mono"', '400 30px "Newsreader"', '700 40px "Be Vietnam Pro"'].map(f => document.fonts.load(f))), sleepReal(3000)]).catch(() => {});
  const ok = await loadThree();
  await fonts;
  if (ok) { try { initWorld(); Cam.init(); if (FILM.world) FILM.world(); } catch (e) { console.error('3D init failed', e); W.ok = false; } }
  if (!W.ok) $('#stage').insertAdjacentHTML('beforeend', `<div class="fallback-note">${UI.fallback}</div>`);
  resize();
  try { new ResizeObserver(resize).observe($('#stage')); new ResizeObserver(resize).observe($('#dock')); } catch (e) { addEventListener('resize', resize); }
  $('#boot').classList.add('gone');
  window.__ready = true;
  addEventListener('hashchange', () => { const j = SCENES.findIndex(s => s.id === location.hash.slice(1)); if (j >= 0 && j !== Show.i) requestGo(j); });
  const h = (location.hash || '').slice(1), hi = SCENES.findIndex(s => s.id === h);
  go(hi >= 0 ? hi : 0);
  requestAnimationFrame(t => { lastT = t; frame(t); });
})();
</script>
</body>
